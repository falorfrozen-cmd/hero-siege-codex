name: AI Code Review

# Opt-in review, ported from hero-siege-offline-toolkit. Nothing here runs on
# its own: a person either adds the `ai-review` label to a pull request or
# comments `@claude review` (or `/claude review`) on it.
#
# Anything written after the trigger phrase is passed to the reviewer as the
# requester's instructions and takes precedence over the default scope:
#   @claude review
#   @claude review only README.md
#   @claude review skip the large text data files, just the code and structure
# The label carries no instructions, so it always requests a full review.
#
# Either trigger may be used again later for a fresh review after pushing
# changes; the label alone does not re-run on later pushes.
#
# Two gates beyond the triggers, both enforced by the action itself:
#   - the requesting user must have write access to this repository, and
#   - a bot actor is rejected, so labelling from automation cannot start a run.
#
# Two things must be in place or the job fails before it reviews anything:
#   - the Claude GitHub App (https://github.com/apps/claude) installed on this
#     repository. Without it the token exchange returns 401, "Claude Code is
#     not installed on this repository", and nothing runs.
#   - the `CLAUDE_CODE_OAUTH_TOKEN` secret, from `claude setup-token`.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # `startsWith` is case-insensitive, so `@Claude Review` also counts.
    if: >-
      github.repository == 'falorfrozen-cmd/hero-siege-codex'
      && (
        (github.event_name == 'pull_request' && github.event.label.name == 'ai-review')
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && (
            startsWith(github.event.comment.body, '@claude review')
            || startsWith(github.event.comment.body, '/claude review')
          )
        )
      )
    # Concurrency lives on the job, and its group is only shared when the
    # event is a real request. Every issue comment and every label starts a
    # run of this workflow, including a plain "thanks" or an unrelated label;
    # at workflow level those runs would join `ai-review-<PR>` before the `if`
    # above is looked at and, with cancel-in-progress, cancel a running review.
    # The predicate is written out twice because neither `concurrency` nor
    # `if` can read a value the other computes. Keep the two copies identical.
    concurrency:
      group: >-
        ${{
        (
        github.repository == 'falorfrozen-cmd/hero-siege-codex'
        && (
        (github.event_name == 'pull_request' && github.event.label.name == 'ai-review')
        || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (
        startsWith(github.event.comment.body, '@claude review')
        || startsWith(github.event.comment.body, '/claude review')
        )
        )
        )
        )
        && format('ai-review-{0}', github.event.pull_request.number || github.event.issue.number)
        || format('ai-review-unrequested-{0}', github.run_id)
        }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The pull request's own head, with full history and every branch,
          # so the reviewer can diff a subset of paths against the base with
          # git instead of pulling the whole pull request through `gh pr diff`.
          # The code is only read, never built or run.
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      # The check after the review counts only comments created after this.
      - name: Note when the review started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Turns the request into the text that follows the slash command. The
      # comment body reaches the shell only through an environment variable,
      # never through `${{ }}` in the script, so it cannot inject commands.
      - name: Read the request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Empty for the label trigger.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Both trigger phrases are 14 characters long.
          instructions=""
          if [ -n "$COMMENT_BODY" ]; then
            instructions="${COMMENT_BODY:14}"
            # Trim surrounding whitespace, including the \r of CRLF comments.
            instructions="${instructions#"${instructions%%[![:space:]]*}"}"
            instructions="${instructions%"${instructions##*[![:space:]]}"}"
          fi
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)

          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "notes<<$delim"
            echo
            echo "The pull request head is checked out in the working directory with full history."
            echo "\`git diff origin/$base...HEAD -- <pathspec>\` shows the pull request's changes for chosen paths only,"
            echo "and \`git diff --stat origin/$base...HEAD\` lists every changed file with its size."
            echo "Pathspecs can exclude too, for example \`-- . ':(exclude)*.txt'\`."
            echo "If \`gh pr diff\` fails because the diff is too large, use git instead."
            if [ -n "$instructions" ]; then
              echo
              echo "The person who requested this review gave these instructions. They take precedence"
              echo "over the default scope of the review and over any step that would read more than they allow:"
              echo
              echo "<requester-instructions>"
              printf '%s\n' "$instructions"
              echo "</requester-instructions>"
              echo
              echo "Pass these instructions verbatim to every agent you launch. When they narrow what to read,"
              echo "do not run \`gh pr diff\`, whose output is the whole pull request: list the changed files with"
              echo "\`git diff --stat\` and read only the permitted ones with a git pathspec. A review was explicitly"
              echo "requested, so an earlier review on this pull request is not a reason to stop. State the scope"
              echo "you reviewed in the final comment."
            fi
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$instructions" ]; then
            echo "Requester instructions:"
            printf '%s\n' "$instructions"
          else
            echo "No requester instructions; full review."
          fi

      - uses: anthropics/claude-code-action@v1
        env:
          # Makes every Agent call run in the foreground. The code-review
          # command runs its whole review through subagents, which run in the
          # background by default; a CI run ends when the model ends its turn,
          # so a review that waited on a background agent posted nothing.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # A subscription OAuth token from `claude setup-token`, not an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}
            ${{ steps.request.outputs.notes }}
          # `--allowedTools` is the whole allow-list for the run, not an addition
          # to the skill's own. It must name every tool the code-review command
          # declares in its `allowed-tools` frontmatter, or the review cannot
          # read the pull request or post its result. The inline-comment tool
          # must stay listed: the action only starts the MCP server that posts
          # inline comments when this argument names it. `Skill` is listed
          # because the prompt is a plugin command. The read-only git commands
          # and Read/Grep/Glob let the review read a chosen subset of the change.
          claude_args: '--allowedTools "Skill,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*)"'

      # The action succeeds whenever the model exits cleanly, which includes a
      # run that reviewed nothing. So the job checks the outcome itself: if no
      # comment or inline comment appeared on the PR after the review started,
      # it fails and prints the review's last message. A run whose eligibility
      # check deliberately stopped (the PR is closed or a draft) also goes red
      # here, with that reason printed: a review was requested and none posted.
      - name: Fail if the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.started.outputs.at }}
          RESULT_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          count() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/$1?since=$SINCE&per_page=100" \
              --jq "[.[] | select(.created_at >= \"$SINCE\")] | length" \
              | awk '{ total += $1 } END { print total + 0 }'
          }
          comments=$(count "issues/$PR/comments")
          inline=$(count "pulls/$PR/comments")
          echo "Posted since $SINCE: $comments comment(s), $inline inline comment(s)."
          if [ "$comments" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::error::The review posted nothing on #$PR. Its last message:"
            jq -r '[.[] | select(.type == "result")] | last | .result // "(no result recorded)"' "$RESULT_FILE" || true
            exit 1
          fi

      # The action prints a trimmed result to the log, and the full result file
      # is gone once the job ends. Keeping it is the only way to see what a
      # review used or what it was denied. It also holds the review transcript,
      # which is visible to anyone with read access to this repository.
      - name: Keep the run's full result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14
